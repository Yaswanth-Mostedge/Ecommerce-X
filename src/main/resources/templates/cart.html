<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CommerceX | Cart</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container">
    <div class="section-head">
        <div><span class="section-label">BAG</span><h1>Your cart</h1></div>
        <span th:text="${#lists.size(items) + ' items'}">0 items</span>
    </div>

    <div th:if="${#lists.isEmpty(items)}" class="empty large">
        <h2>Your cart is empty</h2>
        <p>Discover something worth bringing home.</p>
        <a class="btn dark" th:href="@{/shop}">Continue shopping</a>
    </div>

    <div class="cart-layout" th:unless="${#lists.isEmpty(items)}">
        <section class="cart-list">
            <div class="cart-item" th:each="p : ${items}">
                <img th:src="${p.imageUrl}" th:alt="${p.name}">
                <div class="cart-main">
                    <a th:href="@{/product/{id}(id=${p.id})}" class="title" th:text="${p.name}">Product</a>
                    <span class="muted" th:text="${p.brand}">Brand</span>

                    <div class="cart-bottom">
                        <form method="post" th:action="@{/cart/update}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="id" th:value="${p.id}">
                            <input name="qty" type="number" min="0" th:max="${p.stock}" th:value="${cart[p.id]}" onchange="this.form.submit()">
                        </form>

                        <form method="post" th:action="@{/cart/remove/{id}(id=${p.id})}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="link-btn" type="submit">Remove</button>
                        </form>

                        <strong th:text="${'₹' + #numbers.formatDecimal(p.salePrice * cart[p.id],1,2)}">₹0.00</strong>
                    </div>
                </div>
            </div>

            <form method="post" th:action="@{/cart/clear}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="link-btn" type="submit">Clear cart</button>
            </form>
        </section>

        <aside class="summary">
            <h2>Summary</h2>
            <form method="post" th:action="@{/coupon}" class="coupon">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input name="code" placeholder="Coupon code">
                <button class="btn outline" type="submit">Apply</button>
            </form>
            <div><span>Subtotal</span><b th:text="${'₹' + subtotal}">₹0</b></div>
            <div><span>Discount</span><b th:text="${'-₹' + discount}">-₹0</b></div>
            <div><span>Tax</span><b th:text="${'₹' + tax}">₹0</b></div>
            <div><span>Shipping</span><b th:text="${shipping.signum() == 0 ? 'FREE' : '₹' + shipping}">FREE</b></div>
            <hr>
            <div class="grand"><span>Total</span><b th:text="${'₹' + total}">₹0</b></div>
            <a class="btn dark full" th:href="@{/checkout}">Checkout</a>
        </aside>
    </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
