<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${'CommerceX | ' + product.name}">CommerceX | Product</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container">
    <div class="product-detail">
        <div class="detail-image">
            <img th:src="${product.imageUrl}" th:alt="${product.name}">
        </div>
        <div class="detail-info">
            <span class="eyebrow" th:text="${product.brand + ' · ' + product.category}">Brand · Category</span>
            <h1 th:text="${product.name}">Product</h1>
            <div class="rating-row"><span class="stars">★</span><span th:text="${product.rating}">4.5</span><span class="rating-text">rating</span></div>
            <p class="lead" th:text="${product.description}">Description</p>
            <div class="detail-price">
                <span th:text="${'₹' + #numbers.formatDecimal(salePrice,1,2)}">₹0.00</span>
                <del th:if="${product.discountPercent != null and product.discountPercent > 0}"
                     th:text="${'₹' + #numbers.formatDecimal(product.price,1,2)}">₹0.00</del>
            </div>
            <p class="stock" th:if="${product.stock != null and product.stock > 0}" th:text="${product.stock + ' in stock'}">In stock</p>
            <p class="stock" th:if="${product.stock == null or product.stock <= 0}">Out of stock</p>

            <div class="cart-control">
                <form method="post" th:action="@{/cart/add/{id}(id=${product.id})}"
                      class="buy-row"
                      th:classappend="${session.cart != null and session.cart.containsKey(product.id)} ? 'is-hidden'">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input name="qty" type="number" min="1" th:max="${product.stock}" value="1">
                    <button class="btn dark" type="submit" th:disabled="${product.stock == null or product.stock <= 0}">Add to cart</button>
                    <a class="btn outline" th:href="@{/cart}">View cart</a>
                </form>

                <div class="product-qty-row"
                     th:classappend="${session.cart == null or !session.cart.containsKey(product.id)} ? 'is-hidden'">
                    <div class="qty-stepper product-qty-stepper"
                         th:attr="data-product-id=${product.id},data-max=${product.stock}">
                        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                        <button type="button" class="qty-btn qty-decrement" aria-label="Remove one">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                        <span class="qty-value" th:text="${session.cart != null and session.cart.containsKey(product.id)} ? ${session.cart.get(product.id)} : 0">0</span>
                        <button type="button" class="qty-btn qty-increment" aria-label="Add one"
                                th:disabled="${product.stock != null and session.cart != null and session.cart.containsKey(product.id) and session.cart.get(product.id) >= product.stock}">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        </button>
                    </div>
                    <a class="btn outline" th:href="@{/cart}">View cart</a>
                </div>
            </div>
        </div>
    </div>

    <section class="reviews">
        <h2>Customer reviews</h2>
        <div th:if="${reviews == null or #lists.isEmpty(reviews)}" class="empty">No reviews yet.</div>
        <div class="review" th:each="r : ${reviews}">
            <b th:text="${r.user.name}">Customer</b>
            <span class="rating-row"><span class="stars">★</span><span th:text="${r.rating}">5</span></span>
            <p th:text="${r.comment}">Review</p>
        </div>

        <div sec:authorize="isAuthenticated()" style="margin-top:20px">
            <form method="post"
                  th:action="@{/orders/review/{id}(id=${product.id})}"
                  class="form-card">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <h3>Leave a review</h3>
                <div class="two">
                    <select name="rating" required>
                        <option value="">Rating</option>
                        <option value="5">5 — Excellent</option>
                        <option value="4">4 — Great</option>
                        <option value="3">3 — Good</option>
                        <option value="2">2 — Fair</option>
                        <option value="1">1 — Poor</option>
                    </select>
                    <input name="comment" placeholder="Share your experience" required maxlength="1000">
                </div>
                <button class="btn dark" type="submit" style="margin-top:10px">Post review</button>
            </form>
        </div>
    </section>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
