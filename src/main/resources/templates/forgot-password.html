<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CommerceX | Reset password</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="auth-page">
    <div class="auth-card">
        <a class="brand center" th:href="@{/shop}">CommerceX</a>
        <h1>Reset password</h1>
        <p class="auth-subtitle">Enter your email. Reset links expire after 30 minutes.</p>

        <form method="post" th:action="@{/forgot-password}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input name="email" type="email" placeholder="Email" required>
            <button type="submit">Send reset link</button>
        </form>

        <div th:if="${sent}" class="success-msg">If the account exists, a reset link was generated.</div>
        <div th:if="${resetLink}" class="dev-link"><b>Local development reset link:</b><br><a th:href="${resetLink}" th:text="${resetLink}"></a></div>

        <div class="auth-links">
            <a th:href="@{/login}">Back to sign in</a>
        </div>
    </div>
</main>
</body>
</html>
