<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CommerceX | Email verification</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container">
    <div class="empty large">
        <h1>Email verification</h1>
        <p th:text="${error} ?: 'This verification link is invalid or expired.'">
            This verification link is invalid or expired.
        </p>
        <div class="hero-actions" style="justify-content:center;margin-top:20px">
            <a class="btn dark" th:href="@{/login}">Go to sign in</a>
            <a class="btn outline" th:href="@{/shop}">Continue shopping</a>
        </div>
    </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
