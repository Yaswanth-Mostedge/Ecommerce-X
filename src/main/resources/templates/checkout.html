<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CommerceX | Checkout</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container narrow">
    <div class="section-head"><div><span class="section-label">CHECKOUT</span><h1>Secure checkout</h1></div></div>
    <div th:if="${error}" class="alert" th:text="${error}"></div>

    <form method="post" th:action="@{/checkout}" class="checkout-grid">
        <section class="form-card">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <h2>Shipping details</h2>
            <input name="customerName" placeholder="Full name" required>
            <input name="email" type="email" placeholder="Email" required>
            <input name="phone" placeholder="Phone" required>
            <input name="address" placeholder="Street address" required>
            <div class="two">
                <input name="city" placeholder="City" required>
                <input name="state" placeholder="State" required>
            </div>
            <div class="two">
                <input name="zip" placeholder="ZIP code" required>
                <input name="country" placeholder="Country" value="United States" required>
            </div>

            <h2>Payment</h2>
            <label class="payment-option">
                <input type="radio" name="paymentMethod" value="COD" checked>
                <span>Cash on Delivery</span>
                <span>Pay when delivered</span>
            </label>

            <label class="payment-option disabled">
                <input type="radio" disabled>
                <span>Online payment</span>
                <span>Gateway-ready</span>
            </label>

            <button class="btn dark full" type="submit">Place order</button>
        </section>

        <aside class="summary">
            <h2>Why CommerceX</h2>
            <div><span>Encrypted checkout</span><b>✓</b></div>
            <div><span>Stock verified</span><b>✓</b></div>
            <div><span>Order tracking</span><b>✓</b></div>
            <hr>
            <p class="muted">Your final amount is calculated securely on the server.</p>
        </aside>
    </form>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
