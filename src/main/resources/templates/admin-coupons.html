<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CommerceX | Coupons</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="admin-shell">
<aside class="admin-side">
    <a class="brand" th:href="@{/admin}">CommerceX</a>
    <a th:href="@{/admin}">Dashboard</a>
    <a th:href="@{/admin/products}">Products</a>
    <a th:href="@{/admin/orders}">Orders</a>
    <a class="active" th:href="@{/admin/coupons}">Coupons</a>
    <a th:href="@{/shop}">View store</a>
    <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="logout-button" type="submit">Logout</button>
    </form>
</aside>
<main class="admin-main">
    <div class="section-head"><div><span class="section-label">PROMOTIONS</span><h1>Coupons</h1></div></div>
    <div th:if="${error}" class="alert" th:text="${error}"></div>
    <form class="panel admin-form" method="post" th:action="@{/admin/coupons}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input name="code" placeholder="Coupon code" required>
        <input name="percent" type="number" step="0.01" placeholder="Percent off" required>
        <label><input type="checkbox" name="active" checked> Active</label>
        <button class="btn dark" type="submit">Create coupon</button>
    </form>
    <div class="panel">
        <table class="table">
            <tr><th>Code</th><th>Discount</th><th>Active</th></tr>
            <tr th:each="c : ${coupons}">
                <td th:text="${c.code}">WELCOME10</td>
                <td th:text="${c.percent + '%'}">10%</td>
                <td th:text="${c.active}">true</td>
            </tr>
        </table>
    </div>
</main>
</div>
</body>
</html>
