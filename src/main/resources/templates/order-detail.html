<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CommerceX | Order</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container">
    <div class="section-head">
        <div>
            <span class="section-label">ORDER</span>
            <h1>Order #<span th:text="${order.id}">1</span></h1>
            <span class="muted" th:text="${#temporals.format(order.createdAt,'MMMM d, yyyy HH:mm')}">Date</span>
        </div>
        <span class="status" th:text="${order.status}">CONFIRMED</span>
    </div>

    <div class="timeline">
        <div th:classappend="${order.status == 'PENDING' or order.status == 'CONFIRMED' or order.status == 'PROCESSING' or order.status == 'SHIPPED' or order.status == 'DELIVERED'} ? 'done' : ''"><b>Placed</b></div>
        <div th:classappend="${order.status == 'CONFIRMED' or order.status == 'PROCESSING' or order.status == 'SHIPPED' or order.status == 'DELIVERED'} ? 'done' : ''"><b>Confirmed</b></div>
        <div th:classappend="${order.status == 'PROCESSING' or order.status == 'SHIPPED' or order.status == 'DELIVERED'} ? 'done' : ''"><b>Processing</b></div>
        <div th:classappend="${order.status == 'SHIPPED' or order.status == 'DELIVERED'} ? 'done' : ''"><b>Shipped</b></div>
        <div th:classappend="${order.status == 'DELIVERED'} ? 'done' : ''"><b>Delivered</b></div>
    </div>

    <div class="cart-list">
        <div class="cart-item" th:each="i : ${order.items}">
            <img th:src="${i.imageUrl}" th:alt="${i.productName}">
            <div class="cart-main">
                <b th:text="${i.productName}">Product</b>
                <span th:text="${'Qty: ' + i.quantity}">Qty</span>
                    <strong th:text="${'₹' + #numbers.formatDecimal(i.price * i.quantity,1,2)}">₹0</strong>
            </div>
        </div>
    </div>

    <aside class="summary order-summary">
        <div><span>Subtotal</span><b th:text="${'$' + order.subtotal}">$0</b></div>
        <div><span>Discount</span><b th:text="${'-$' + order.discount}">-$0</b></div>
        <div><span>Tax</span><b th:text="${'$' + order.tax}">$0</b></div>
        <div><span>Shipping</span><b th:text="${'$' + order.shipping}">$0</b></div>
            <div><span>Subtotal</span><b th:text="${'₹' + order.subtotal}">₹0</b></div>
            <div><span>Discount</span><b th:text="${'-₹' + order.discount}">-₹0</b></div>
            <div><span>Tax</span><b th:text="${'₹' + order.tax}">₹0</b></div>
            <div><span>Shipping</span><b th:text="${'₹' + order.shipping}">₹0</b></div>
            <hr>
            <div class="grand"><span>Total</span><b th:text="${'₹' + order.total}">₹0</b></div>

        <form th:if="${order.status == 'PENDING' or order.status == 'CONFIRMED'}"
              method="post"
              th:action="@{/orders/{id}/cancel(id=${order.id})}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn danger full" type="submit">Cancel order</button>
        </form>
    </aside>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
