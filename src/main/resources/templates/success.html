<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CommerceX | Order confirmed</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container">
    <div class="empty large">
        <div class="success-icon">✓</div>
        <h1>Order confirmed</h1>
        <p>Your CommerceX order #<b th:text="${orderId}">1</b> has been placed.</p>
        <div class="hero-actions" style="justify-content:center;margin-top:20px">
            <a class="btn dark" th:href="@{/orders}">View orders</a>
            <a class="btn outline" th:href="@{/shop}">Continue shopping</a>
        </div>
    </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
