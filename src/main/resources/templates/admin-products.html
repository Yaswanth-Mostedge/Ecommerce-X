<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CommerceX | Products</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="admin-shell">
<aside class="admin-side">
    <a class="brand" th:href="@{/admin}">CommerceX</a>
    <a th:href="@{/admin}">Dashboard</a>
    <a class="active" th:href="@{/admin/products}">Products</a>
    <a th:href="@{/admin/orders}">Orders</a>
    <a th:href="@{/admin/coupons}">Coupons</a>
    <a th:href="@{/shop}">View store</a>
    <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="logout-button" type="submit">Logout</button>
    </form>
</aside>
<main class="admin-main">
    <div class="section-head"><div><span class="section-label">CATALOG</span><h1>Products</h1></div></div>

    <div th:if="${error}" class="alert" th:text="${error}"></div>

    <form class="panel admin-form" method="post" th:action="@{/admin/products/save}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input name="name" placeholder="Product name" required>
        <input name="brand" placeholder="Brand">
        <input name="category" placeholder="Category">
        <input name="price" type="number" step="0.01" placeholder="Price" required>
        <input name="discountPercent" type="number" step="0.01" placeholder="Discount %">
        <input name="stock" type="number" placeholder="Stock" required>
        <input name="imageUrl" placeholder="Image URL">
        <textarea name="description" placeholder="Description"></textarea>
        <button class="btn dark" type="submit">Save product</button>
    </form>

    <div class="panel">
        <table class="table">
            <tr><th>Product</th><th>Price</th><th>Stock</th><th>Actions</th></tr>
            <tr th:each="p : ${products}">
                <td th:text="${p.name}">Product</td>
                <td th:text="${'₹' + p.price}">₹0</td>
                <td>
                    <form method="post" th:action="@{/admin/products/{id}/stock(id=${p.id})}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input name="stock" type="number" th:value="${p.stock}" class="small-input">
                        <button type="submit">Update</button>
                    </form>
                </td>
                <td>
                    <form method="post" th:action="@{/admin/products/{id}/delete(id=${p.id})}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="danger-text">Delete</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>
</main>
</div>
</body>
</html>
