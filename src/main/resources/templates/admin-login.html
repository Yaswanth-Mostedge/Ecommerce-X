<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CommerceX | Admin</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="auth-page">
    <div class="auth-card">
        <a class="brand center" th:href="@{/shop}">CommerceX</a>
        <span class="eyebrow">ADMIN CONSOLE</span>
        <h1>Administrator sign in</h1>
        <p class="auth-subtitle">Manage products, inventory, orders and coupons.</p>

        <div th:if="${param.error}" class="alert">Invalid administrator credentials.</div>

        <form method="post" th:action="@{/login}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="email" name="username" placeholder="Admin email" required>
            <input type="password" name="password" placeholder="Admin password" required>
            <button type="submit">Enter admin console</button>
        </form>

        <div class="auth-links">
            <a th:href="@{/login}">Customer sign in</a>
            <a th:href="@{/forgot-password}">Forgot password?</a>
            <a th:href="@{/shop}">Back to store</a>
        </div>
    </div>
</main>
</body>
</html>
