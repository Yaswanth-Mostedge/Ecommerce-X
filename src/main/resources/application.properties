spring.application.name=CommerceX
server.port=${PORT:8080}

# ==========================================
# DATASOURCE (H2 in-memory by default; override with DB_URL/etc. for MySQL)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:h2:mem:commercex;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# ==========================================
# JPA
# ==========================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# THYMELEAF
# ==========================================
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# ==========================================
# MAIL (password reset)
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

commercex.mail.from=${MAIL_FROM:no-reply@commercex.local}
commercex.base-url=${APP_BASE_URL:http://localhost:8080}
commercex.tax-rate=${TAX_RATE:0.08}
commercex.shipping-flat=${SHIPPING_FLAT:9.99}
commercex.free-shipping-threshold=${FREE_SHIPPING_THRESHOLD:75}
commercex.upload-dir=${UPLOAD_DIR:uploads}

# ==========================================
# FILE UPLOAD (admin banner)
# ==========================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

