spring.application.name=CommerceX
server.port=${PORT:8080}

# ==========================================
# MYSQL
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/commercex?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Admin@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA
# ==========================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# THYMELEAF
# ==========================================
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# ==========================================
# MAIL (password reset)
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

commercex.mail.from=${MAIL_FROM:no-reply@commercex.local}
commercex.base-url=${APP_BASE_URL:http://localhost:8080}
commercex.tax-rate=${TAX_RATE:0.08}
commercex.shipping-flat=${SHIPPING_FLAT:9.99}
commercex.free-shipping-threshold=${FREE_SHIPPING_THRESHOLD:75}

