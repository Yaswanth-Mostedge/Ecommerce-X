<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${'CommerceX | ' + product.name}">CommerceX | Product</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container">
    <div class="product-detail">
        <div class="detail-image">
            <img th:src="${product.imageUrl}" th:alt="${product.name}">
        </div>
        <div class="detail-info">
            <span class="eyebrow" th:text="${product.brand + ' · ' + product.category}">Brand · Category</span>
            <h1 th:text="${product.name}">Product</h1>
            <div class="rating-row"><span class="stars">★</span><span th:text="${product.rating}">4.5</span><span class="rating-text">rating</span></div>
            <p class="lead" th:text="${product.description}">Description</p>
            <div class="detail-price">
                <span th:text="${'₹' + #numbers.formatDecimal(salePrice,1,2)}">₹0.00</span>
                <del th:if="${product.discountPercent != null and product.discountPercent > 0}"
                     th:text="${'₹' + #numbers.formatDecimal(product.price,1,2)}">₹0.00</del>
            </div>
            <p class="stock" th:if="${product.stock != null and product.stock > 0}" th:text="${product.stock + ' in stock'}">In stock</p>
            <p class="stock" th:if="${product.stock == null or product.stock <= 0}">Out of stock</p>

            <form method="post" th:action="@{/cart/add/{id}(id=${product.id})}" class="buy-row">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input name="qty" type="number" min="1" th:max="${product.stock}" value="1">
                <button class="btn dark" type="submit" th:disabled="${product.stock == null or product.stock <= 0}">Add to cart</button>
                <a class="btn outline" th:href="@{/cart}">View cart</a>
            </form>
        </div>
    </div>

    <section class="reviews">
        <h2>Customer reviews</h2>
        <div th:if="${reviews == null or #lists.isEmpty(reviews)}" class="empty">No reviews yet.</div>
        <div class="review" th:each="r : ${reviews}">
            <b th:text="${r.user.name}">Customer</b>
            <span class="rating-row"><span class="stars">★</span><span th:text="${r.rating}">5</span></span>
            <p th:text="${r.comment}">Review</p>
        </div>

        <div sec:authorize="isAuthenticated()" style="margin-top:20px">
            <form method="post"
                  th:action="@{/orders/review/{id}(id=${product.id})}"
                  class="form-card">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <h3>Leave a review</h3>
                <div class="two">
                    <select name="rating" required>
                        <option value="">Rating</option>
                        <option value="5">5 — Excellent</option>
                        <option value="4">4 — Great</option>
                        <option value="3">3 — Good</option>
                        <option value="2">2 — Fair</option>
                        <option value="1">1 — Poor</option>
                    </select>
                    <input name="comment" placeholder="Share your experience" required maxlength="1000">
                </div>
                <button class="btn dark" type="submit" style="margin-top:10px">Post review</button>
            </form>
        </div>
    </section>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
