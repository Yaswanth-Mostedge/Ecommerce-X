<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CommerceX | Orders</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="admin-shell">
<aside class="admin-side">
    <a class="brand" th:href="@{/admin}">CommerceX</a>
    <a th:href="@{/admin}">Dashboard</a>
    <a th:href="@{/admin/products}">Products</a>
    <a class="active" th:href="@{/admin/orders}">Orders</a>
    <a th:href="@{/admin/coupons}">Coupons</a>
    <a th:href="@{/shop}">View store</a>
    <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="logout-button" type="submit">Logout</button>
    </form>
</aside>
<main class="admin-main">
    <div class="section-head"><div><span class="section-label">FULFILLMENT</span><h1>Orders</h1></div></div>
    <div class="panel">
        <table class="table">
            <tr><th>ID</th><th>Customer</th><th>Total</th><th>Status</th><th>Update</th></tr>
            <tr th:each="o : ${orders}">
                <td th:text="${o.id}">1</td>
                <td th:text="${o.customerName}">Customer</td>
                <td th:text="${'₹' + o.total}">₹0</td>
                <td><span class="status" th:text="${o.status}">CONFIRMED</span></td>
                <td>
                    <form method="post" th:action="@{/admin/orders/{id}/status(id=${o.id})}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <select name="status">
                            <option value="CONFIRMED" th:selected="${o.status == 'CONFIRMED'}">CONFIRMED</option>
                            <option value="PROCESSING" th:selected="${o.status == 'PROCESSING'}">PROCESSING</option>
                            <option value="SHIPPED" th:selected="${o.status == 'SHIPPED'}">SHIPPED</option>
                            <option value="DELIVERED" th:selected="${o.status == 'DELIVERED'}">DELIVERED</option>
                            <option value="CANCELLED" th:selected="${o.status == 'CANCELLED'}">CANCELLED</option>
                        </select>
                        <button type="submit">Save</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>
</main>
</div>
</body>
</html>
