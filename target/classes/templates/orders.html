<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CommerceX | Orders</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container">
    <div class="section-head"><div><span class="section-label">ACCOUNT</span><h1>My orders</h1></div></div>

    <div th:if="${#lists.isEmpty(orders)}" class="empty large">
        <h2>No orders yet</h2>
        <p>Start shopping to see your orders here.</p>
        <a class="btn dark" th:href="@{/shop}">Start shopping</a>
    </div>

    <div class="order-card" th:each="o : ${orders}">
        <div>
            <span class="muted">Order #</span>
            <b th:text="${o.id}">1</b>
            <span class="muted" th:text="${#temporals.format(o.createdAt,'MMM d, yyyy HH:mm')}">Date</span>
        </div>
        <span class="status" th:text="${o.status}">CONFIRMED</span>
        <strong th:text="${'₹' + o.total}">₹0</strong>
        <a class="btn outline" th:href="@{/orders/{id}(id=${o.id})}">Details</a>
    </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
