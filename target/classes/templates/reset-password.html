<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CommerceX | New password</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="auth-page">
    <div class="auth-card">
        <a class="brand center" th:href="@{/shop}">CommerceX</a>
        <h1>Choose a new password</h1>
        <div th:if="${error}" class="alert" th:text="${error}"></div>

        <form method="post" th:action="@{/reset-password}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="token" th:value="${token}">
            <input name="password" type="password" minlength="8" placeholder="New password" required>
            <button type="submit">Update password</button>
        </form>
    </div>
</main>
</body>
</html>
