<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CommerceX | Admin</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="admin-shell">
<aside class="admin-side">
    <a class="brand" th:href="@{/admin}">CommerceX</a>
    <a class="active" th:href="@{/admin}">Dashboard</a>
    <a th:href="@{/admin/products}">Products</a>
    <a th:href="@{/admin/orders}">Orders</a>
    <a th:href="@{/admin/coupons}">Coupons</a>
    <a th:href="@{/shop}">View store</a>
    <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="logout-button" type="submit">Logout</button>
    </form>
</aside>
<main class="admin-main">
    <div class="section-head">
        <div><span class="section-label">COMMERCE X</span><h1>Admin dashboard</h1></div>
        <span class="muted">Operations overview</span>
    </div>

    <div class="stats">
        <div><span>Products</span><b th:text="${productCount}">0</b></div>
        <div><span>Orders</span><b th:text="${orderCount}">0</b></div>
        <div><span>Customers</span><b th:text="${userCount}">0</b></div>
    </div>

    <div class="panel">
        <h2>Recent orders</h2>
        <table class="table">
            <tr><th>ID</th><th>Customer</th><th>Status</th><th>Total</th></tr>
            <tr th:each="o : ${orders}">
                <td th:text="${o.id}">1</td>
                <td th:text="${o.customerName}">Customer</td>
                <td><span class="status" th:text="${o.status}">CONFIRMED</span></td>
                <td th:text="${'₹' + o.total}">₹0</td>
            </tr>
        </table>
    </div>
</main>
</div>
</body>
</html>
