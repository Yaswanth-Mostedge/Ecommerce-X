<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CommerceX | Something went wrong</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container">
    <div class="empty large">
        <h1 th:text="${heading} ?: 'Something went wrong'">Something went wrong</h1>
        <p th:text="${message} ?: 'We hit an unexpected problem. Please try again.'">
            We hit an unexpected problem. Please try again.
        </p>
        <p class="muted" th:if="${status}" th:text="'Error ' + ${status}">Error 500</p>
        <div class="hero-actions" style="justify-content:center;margin-top:20px">
            <a class="btn dark" th:href="@{/shop}">Back to store</a>
        </div>
    </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
